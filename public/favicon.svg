<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cross Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#042f2e" flood-opacity="0.3" />
    </filter>

    <!-- Pill Shadow -->
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#042f2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bgGrad)" />
  <!-- Inner Border Highlight -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" />

  <!-- Medical Cross with Soft Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Vertical Cross Arm -->
    <rect x="216" y="96" width="80" height="320" rx="24" ry="24" fill="#ffffff" />
    <!-- Horizontal Cross Arm -->
    <rect x="96" y="216" width="320" height="80" rx="24" ry="24" fill="#ffffff" />
  </g>

  <!-- Diagonal Medicine Capsule Pill Centerpiece -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#pillShadow)">
    <!-- Pill Outer Outline / Container -->
    <rect x="176" y="212" width="160" height="88" rx="44" ry="44" fill="#ffffff" stroke="#0f766e" stroke-width="6" />

    <!-- Left Half: Vibrant Medical Teal -->
    <path d="M 220 215 A 41 41 0 0 0 179 256 A 41 41 0 0 0 220 297 L 253 297 L 253 215 Z" fill="#0d9488" />
    
    <!-- Right Half: Crisp Clinical White -->
    <path d="M 292 215 A 41 41 0 0 1 333 256 A 41 41 0 0 1 292 297 L 259 297 L 259 215 Z" fill="#ffffff" />

    <!-- Divider Line -->
    <line x1="256" y1="215" x2="256" y2="297" stroke="#042f2e" stroke-width="4" stroke-opacity="0.3" />

    <!-- Glossy Highlight / Reflection on Top Half of Capsule -->
    <path d="M 195 228 C 215 220, 297 220, 317 228 C 300 234, 212 234, 195 228 Z" fill="#ffffff" fill-opacity="0.6" />

    <!-- Tiny Medical Plus inside Left Half of Pill -->
    <rect x="207" y="252" width="14" height="8" rx="2" fill="#ffffff" />
    <rect x="210" y="249" width="8" height="14" rx="2" fill="#ffffff" />
  </g>
</svg>
